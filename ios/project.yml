name: DungeonDoor
options:
  bundleIdPrefix: com.jmm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2BRYAM5Q52
    SWIFT_VERSION: "5.0"
    # Public version (CFBundleShortVersionString). ship.sh does not bump this.
    MARKETING_VERSION: "0.17"
    # Local build number (CFBundleVersion). TestFlight replaces it at upload: fastlane bump_build
    # sets it to one past the newest TestFlight build, in the temporary worktree, and does not
    # write that number back here. The server's MIN_APP_BUILD compares against the shipped number.
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  DungeonDoor:
    type: application
    platform: iOS
    sources:
      - path: DungeonDoor
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    # Push notifications (docs/push.md). The App Store profile carries aps-environment: production;
    # a build run from Xcode talks to Apple's sandbox.
    entitlements:
      path: DungeonDoor/DungeonDoor.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: DungeonDoor/Info.plist
      properties:
        DDAPIBase: $(DD_API_BASE)
        DDAppKey: $(DD_APP_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmm.the-dungeon-door
        PRODUCT_NAME: DungeonDoor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dungeon Door
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.role-playing-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save a scene painting or a portrait to your photo library.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  # Unit tests for the app's pure logic. Not hosted in the app: they compile only the files they test.
  DungeonDoorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DungeonDoorTests
      - path: DungeonDoor/Core/ReturnKey.swift
      - path: DungeonDoor/Core/TurnOrder.swift
      - path: DungeonDoor/Core/TurnResult.swift
      - path: DungeonDoor/Core/CompanionCall.swift
      - path: DungeonDoor/Views/Game/PlayTurn.swift
      - path: DungeonDoor/Core/Models.swift
      - path: DungeonDoor/Core/SRD.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmm.the-dungeon-door.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  # The app driven as a player drives it (keyboard, taps), against a local server: DD_API_BASE,
  # DD_PLAYER and DD_GAME name the server, the player and the game (passed in as TEST_RUNNER_DD_*).
  DungeonDoorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DungeonDoorUITests
    dependencies:
      - target: DungeonDoor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmm.the-dungeon-door.uitests
        TEST_TARGET_NAME: DungeonDoor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
